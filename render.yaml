services:
  - type: web
    name: commitflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOSTED
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GITHUB_TOKEN
        sync: false
